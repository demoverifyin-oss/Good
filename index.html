<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torii Falling Clock</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #05060a;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #stage {
    position: relative;
    width: 423px;
    height: 740px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 423 / 740;
  }
  #bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #dateLabel {
    position: absolute;
    left: 50%;
    bottom: 4%;
    transform: translateX(-50%);
    color: rgba(255, 210, 220, 0.55);
    font-size: 11px;
    letter-spacing: 3px;
    text-shadow: 0 0 6px rgba(255,60,90,0.6);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="stage">
  <img id="bg" src="torii.jpg" alt="Torii gate">
  <canvas id="c"></canvas>
  <div id="dateLabel"></div>
</div>

<script>
const stage = document.getElementById('stage');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dateLabel = document.getElementById('dateLabel');

let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1;
  const rect = stage.getBoundingClientRect();
  W = rect.width; H = rect.height;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Gate apex point (relative to image, based on the torii's top finial box)
const GATE_X_REL = 0.497;
const GATE_Y_REL = 0.225;

// Target formation center (inside the gate opening)
const TARGET_Y_REL = 0.40;

function offscreenTextPoints(text, fontSizePx, spacing) {
  const off = document.createElement('canvas');
  off.width = W; off.height = 200;
  const octx = off.getContext('2d');
  octx.clearRect(0, 0, off.width, off.height);
  octx.font = `700 ${fontSizePx}px 'Courier New', monospace`;
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.fillText(text, off.width / 2, 100);
  const data = octx.getImageData(0, 0, off.width, off.height).data;
  const pts = [];
  for (let y = 0; y < off.height; y += spacing) {
    for (let x = 0; x < off.width; x += spacing) {
      const idx = (y * off.width + x) * 4 + 3;
      if (data[idx] > 128) pts.push({ x, y: y - 100 });
    }
  }
  return pts;
}

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.state = 'falling'; // falling -> holding -> breaking
    const gx = GATE_X_REL * W;
    const gy = GATE_Y_REL * H;
    this.x = gx + (Math.random() - 0.5) * 14;
    this.y = gy + (Math.random() - 0.5) * 10;
    this.vx = 0; this.vy = 0;
    this.delay = Math.random() * 0.5;
    this.t = 0;
    this.size = 1.4 + Math.random() * 1.3;
    this.hue = 340 + Math.random() * 20; // pink/red like the torii
    this.settleJitterPhase = Math.random() * Math.PI * 2;
  }
  assignTarget(tx, ty) {
    this.tx = tx; this.ty = ty;
    this.sx = this.x; this.sy = this.y;
  }
  update(dt, phase) {
    if (phase === 'falling') {
      this.t += dt;
      const local = Math.max(0, this.t - this.delay);
      const dur = 1.3;
      let p = Math.min(1, local / dur);
      // ease-out with slight overshoot (falls past, settles back) -> "gravity drop" feel
      const ease = 1 - Math.pow(1 - p, 3);
      const overshoot = p < 1 ? Math.sin(p * Math.PI) * 0.06 * (1 - p) : 0;
      this.x = this.sx + (this.tx - this.sx) * ease;
      this.y = this.sy + (this.ty - this.sy) * ease + overshoot * 40;
    } else if (phase === 'holding') {
      this.t += dt;
      this.x = this.tx + Math.sin(this.t * 1.6 + this.settleJitterPhase) * 0.6;
      this.y = this.ty + Math.cos(this.t * 1.3 + this.settleJitterPhase) * 0.6;
    } else if (phase === 'breaking') {
      this.t += dt;
      if (this.vy === 0 && this.vx === 0 && this.t < 0.05) {
        this.vx = (Math.random() - 0.5) * 60;
        this.vy = 20 + Math.random() * 40;
      }
      this.vy += 260 * dt; // gravity
      this.x += this.vx * dt;
      this.y += this.vy * dt;
    }
  }
  draw() {
    let alpha = 1;
    if (this.state === undefined) return;
  }
}

let particles = [];
let cycleTime = 0;
let phase = 'falling'; // falling -> holding -> breaking
const PHASE_DURATIONS = { falling: 1.8, holding: 2.2, breaking: 1.4 };

function pad(n) { return n.toString().padStart(2, '0'); }

function currentTimeString() {
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function buildParticlesForText(text) {
  const fontSize = Math.round(W * 0.155);
  const spacing = 3;
  const pts = offscreenTextPoints(text, fontSize, spacing);
  const targetCx = W / 2;
  const targetCy = TARGET_Y_REL * H;

  particles = pts.map(pt => {
    const p = new Particle();
    p.assignTarget(targetCx + pt.x, targetCy + pt.y);
    return p;
  });
}

function startCycle() {
  buildParticlesForText(currentTimeString());
  phase = 'falling';
  cycleTime = 0;
  dateLabel.textContent = new Date().toLocaleDateString('hi-IN', {
    day: '2-digit', month: 'short', year: 'numeric'
  }).toUpperCase();
}

startCycle();

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  cycleTime += dt;

  if (phase === 'falling' && cycleTime > PHASE_DURATIONS.falling) {
    phase = 'holding'; cycleTime = 0;
    particles.forEach(p => { p.t = 0; });
  } else if (phase === 'holding' && cycleTime > PHASE_DURATIONS.holding) {
    phase = 'breaking'; cycleTime = 0;
    particles.forEach(p => { p.t = 0; p.vx = 0; p.vy = 0; });
  } else if (phase === 'breaking' && cycleTime > PHASE_DURATIONS.breaking) {
    startCycle();
  }

  ctx.clearRect(0, 0, W, H);

  // faint glow line from gate apex during falling phase
  if (phase === 'falling') {
    const gx = GATE_X_REL * W, gy = GATE_Y_REL * H;
    const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, 26);
    grad.addColorStop(0, 'rgba(255,90,120,0.55)');
    grad.addColorStop(1, 'rgba(255,90,120,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(gx, gy, 26, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const p of particles) {
    p.update(dt, phase);
    let alpha = 0.95;
    if (phase === 'breaking') {
      const p2 = Math.min(1, p.t / PHASE_DURATIONS.breaking);
      alpha = 0.95 * (1 - p2);
      if (p.y - (TARGET_Y_REL * H) > H) continue;
    }
    if (p.y < -20 || p.y > H + 40) continue;
    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue}, 90%, 62%, ${alpha})`;
    ctx.shadowColor = `hsla(${p.hue}, 100%, 60%, ${alpha * 0.8})`;
    ctx.shadowBlur = 4;
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
